name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Новый пуш в ту же ветку отменяет предыдущий прогон — незачем занимать
# раннеры проверкой заведомо устаревшего коммита.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Без явной версии action падает с «No pnpm version is specified».
          # Мажорная 10 — та же, что стоит на Replit; локфайл версии 9.0
          # читают и 10, и 11, так что расхождение с машинами разработчиков
          # безопасно.
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Проверяет все пакеты, включая мобильный. Раньше мобильный шёл
      # отдельной непадающей джобой из-за накопленных ошибок типов —
      # они исправлены (задача 98).
      - name: Typecheck
        run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: typecheck

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Без явной версии action падает с «No pnpm version is specified».
          # Мажорная 10 — та же, что стоит на Replit; локфайл версии 9.0
          # читают и 10, и 11, так что расхождение с машинами разработчиков
          # безопасно.
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ловит то, что проверка типов пропускает: ошибки бандлера,
      # неразрешённые импорты, забытые зависимости.
      - name: Build
        # vite.config.ts у админки и песочницы читает PORT при загрузке
        # конфига — даже когда порт для сборки не нужен. Значение здесь
        # произвольное, на результат сборки не влияет.
        env:
          PORT: "5000"
        run: pnpm -r --if-present run build

  codegen-check:
    name: Codegen is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Без явной версии action падает с «No pnpm version is specified».
          # Мажорная 10 — та же, что стоит на Replit; локфайл версии 9.0
          # читают и 10, и 11, так что расхождение с машинами разработчиков
          # безопасно.
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Клиент и Zod-схемы генерируются из openapi.yaml. Если спецификацию
      # правят, а codegen не прогоняют, контракт и клиент расходятся молча —
      # эта джоба ловит расхождение.
      - name: Regenerate API client
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Fail if generated files differ
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Сгенерированные файлы устарели. Запустите: pnpm --filter @workspace/api-spec run codegen"
            git --no-pager diff --stat
            exit 1
          fi
