<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EVGO — зарядки для электромобилей по всему Узбекистану</title>
    <meta
      name="description"
      content="Карта зарядных станций Узбекистана: видно, свободна ли станция, до того как вы поехали. Маршрут с остановками под запас хода вашей машины, оплата с баланса."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0e1a" />

    <!-- Канонический адрес — боевой домен evgo.uz. -->
    <link rel="canonical" href="https://evgo.uz/" />

    <!-- Ссылку на лендинг чаще всего кидают в Telegram — карточка там
         формируется по Open Graph. Соцсети-краулеры требуют абсолютный og:image. -->
    <meta property="og:title" content="EVGO — зарядки для электромобилей по всему Узбекистану" />
    <meta
      property="og:description"
      content="Видно, свободна ли станция, до того как вы поехали. Маршрут с остановками, оплата с баланса у любого партнёра."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EVGO" />
    <meta property="og:url" content="https://evgo.uz/" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:image" content="https://evgo.uz/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EVGO — зарядки Узбекистана на одной карте" />
    <meta
      name="twitter:description"
      content="Видно, свободна ли станция, до того как вы поехали."
    />
    <meta name="twitter:image" content="https://evgo.uz/og.svg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Structured data: помогает Google показывать карточку организации
         и поиск по сайту. Schema.org Organization + WebSite. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "EVGO",
            "url": "https://evgo.uz/",
            "logo": "https://evgo.uz/favicon.svg",
            "description": "Агрегатор зарядных станций для электромобилей в Узбекистане.",
            "areaServed": { "@type": "Country", "name": "Узбекистан" },
            "email": "support@evgo.uz"
          },
          {
            "@type": "WebSite",
            "name": "EVGO",
            "url": "https://evgo.uz/",
            "inLanguage": "ru-RU"
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Onest:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
