openapi: "3.1.0"
info:
  title: Api
  version: "1.0.0"
servers:
  - url: /api

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Operators ───────────────────────────────────────────────
  /operators:
    get:
      operationId: getOperators
      summary: List all operators
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Operator"
    post:
      operationId: createOperator
      summary: Create operator (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"

  /operators/{id}:
    get:
      operationId: getOperator
      summary: Get operator by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
    put:
      operationId: updateOperator
      summary: Update operator (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
    delete:
      operationId: deleteOperator
      summary: Delete operator (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Stations ─────────────────────────────────────────────────
  /stations:
    get:
      operationId: getStations
      summary: List stations with optional filters
      parameters:
        - in: query
          name: connector_type
          schema:
            type: string
        - in: query
          name: min_power
          schema:
            type: number
        - in: query
          name: max_power
          schema:
            type: number
        - in: query
          name: status
          schema:
            type: string
            enum: [free, occupied, offline]
        - in: query
          name: operator_id
          schema:
            type: integer
        - in: query
          name: lat
          schema:
            type: number
        - in: query
          name: lng
          schema:
            type: number
        - in: query
          name: radius_km
          schema:
            type: number
        - in: query
          name: amenities
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationsResponse"
    post:
      operationId: createStation
      summary: Create station (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Station"

  /stations/{id}:
    get:
      operationId: getStation
      summary: Get station by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
    put:
      operationId: updateStation
      summary: Update station (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StationInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
    delete:
      operationId: deleteStation
      summary: Delete station (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /stations/{id}/status:
    patch:
      operationId: updateStationStatus
      summary: Toggle station status (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StationStatusUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Station"

  # ── Vehicles ─────────────────────────────────────────────────
  /vehicles:
    get:
      operationId: getVehicles
      summary: List vehicles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"
    post:
      operationId: createVehicle
      summary: Create a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  /vehicles/{id}:
    get:
      operationId: getVehicle
      summary: Get vehicle by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
    put:
      operationId: updateVehicle
      summary: Update vehicle
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
    delete:
      operationId: deleteVehicle
      summary: Delete vehicle
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Routes ───────────────────────────────────────────────────
  /routes:
    get:
      operationId: getRoutes
      summary: List routes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Route"
    post:
      operationId: createRoute
      summary: Create a smart route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"

  /routes/{id}:
    get:
      operationId: getRoute
      summary: Get route by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
    delete:
      operationId: deleteRoute
      summary: Delete route
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Charging Sessions ────────────────────────────────────────
  /sessions:
    get:
      operationId: getSessions
      summary: List charging sessions
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, completed, cancelled]
        - in: query
          name: station_id
          schema:
            type: integer
        - in: query
          name: user_id
          description: >
            Только для админского токена. Пользователю всегда возвращаются
            его собственные сессии, параметр игнорируется.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: startSession
      summary: Start a charging session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{id}:
    get:
      operationId: getSession
      summary: Get session by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{id}/stop:
    patch:
      operationId: stopSession
      summary: Stop a charging session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{id}/pay:
    post:
      operationId: paySession
      summary: Pay for a completed session (mock MVP)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  # ── Notifications ────────────────────────────────────────────
  /notifications:
    get:
      operationId: getNotifications
      summary: List notifications for a user
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
    post:
      operationId: createNotification
      summary: Create a notification (admin/internal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      summary: Mark notification as read
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/broadcast:
    post:
      operationId: broadcastNotification
      summary: Broadcast a notification to all users (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: integer

  # ── Push Tokens ───────────────────────────────────────────────
  /push-tokens:
    post:
      operationId: registerPushToken
      summary: Register a push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushToken"

  # ── Vehicles Search ───────────────────────────────────────────
  /vehicles/search:
    get:
      operationId: searchVehicles
      summary: Search vehicles via API Ninjas (cached)
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

  # ── Users ────────────────────────────────────────────────────
  /users:
    get:
      operationId: getUsers
      summary: List all users (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      summary: Create or register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      summary: Get user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      operationId: updateUser
      summary: Update user profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /stations/{id}/verify:
    post:
      operationId: verifyStation
      summary: Отметить станцию проверенной
      description: >
        Ставит дату проверки и подписывает её почтой администратора из токена.
        Дата показывается пользователю: основной источник станций —
        OpenChargeMap, где часть записей устарела.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: integer }
                  verified_at: { type: string, format: date-time, nullable: true }
                  verified_by: { type: string, nullable: true }
        "401": { description: Требуется админский токен }
        "404": { description: Станция не найдена }

  /stations/{id}/report:
    post:
      operationId: reportStation
      summary: Сообщить о неточности в данных станции
      description: >
        Если у пользователя уже есть неразобранная жалоба на эту станцию,
        она обновляется — чтобы один человек не засыпал станцию жалобами.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StationReportInput"
      responses:
        "200": { description: Обновлена существующая жалоба }
        "201": { description: Жалоба создана }
        "401": { description: Требуется вход }
        "404": { description: Станция не найдена }

  /admin/station-reports:
    get:
      operationId: getStationReports
      summary: Очередь жалоб на станции
      parameters:
        - in: query
          name: status
          description: По умолчанию — только неразобранные
          schema:
            type: string
            enum: [new, confirmed, rejected]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StationReport"
        "401": { description: Требуется админский токен }

  /admin/station-reports/count:
    get:
      operationId: getStationReportsCount
      summary: Число неразобранных жалоб
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [new]
                properties:
                  new: { type: integer }
        "401": { description: Требуется админский токен }

  /admin/station-reports/{id}:
    patch:
      operationId: resolveStationReport
      summary: Разобрать жалобу
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveStationReportInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationReport"
        "401": { description: Требуется админский токен }
        "404": { description: Жалоба не найдена }

  # ── Auth ──────────────────────────────────────────────────────
  # Вход по номеру телефона с подтверждением кодом из SMS.
  #
  # ВНИМАНИЕ при генерации клиента: /auth/refresh нельзя вызывать через
  # customFetch — этот же обработчик срабатывает на 401 и уйдёт в рекурсию.
  # В мобильном приложении все три эндпоинта вызываются вручную
  # (artifacts/mobile/lib/authApi.ts).
  /auth/request-code:
    post:
      operationId: requestAuthCode
      summary: Отправить код подтверждения на номер телефона
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCodeInput"
      responses:
        "200":
          description: Код отправлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestCodeResult"
        "400": { description: Неверный номер }
        "429": { description: Слишком часто — см. retry_after_seconds }
        "502": { description: SMS-шлюз недоступен }

  /auth/verify-code:
    post:
      operationId: verifyAuthCode
      summary: Проверить код и получить пару токенов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCodeInput"
      responses:
        "200":
          description: Вход выполнен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400": { description: Неверный или истёкший код }
        "429": { description: Слишком много попыток }

  /auth/refresh:
    post:
      operationId: refreshAuthToken
      summary: Обновить пару токенов
      description: >
        Старый refresh-токен гасится, выдаётся новый. Вызывать в обход
        сгенерированного клиента — иначе 401 отсюда снова запустит обновление.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401": { description: Токен отозван или истёк }

  /auth/logout:
    post:
      operationId: logout
      summary: Отозвать refresh-токен
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "204": { description: Сессия закрыта }

  /auth/me:
    get:
      operationId: getMe
      summary: Профиль текущего пользователя
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { description: Требуется вход }
    patch:
      operationId: updateMe
      summary: Изменить свой профиль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { description: Требуется вход }
    delete:
      operationId: deleteMe
      summary: Удалить свой аккаунт
      description: >
        Обязательно по правилам App Store. Персональные данные стираются,
        сессии зарядок остаются обезличенными для сверки с операторами.
      responses:
        "204": { description: Аккаунт удалён }
        "401": { description: Требуется вход }

  # ── Payment Methods ───────────────────────────────────────────
  /payment-methods:
    get:
      operationId: getPaymentMethods
      summary: Платёжные методы текущего пользователя
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethod"
    post:
      operationId: addPaymentMethod
      summary: Add payment method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentMethodInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"

  /payment-methods/{id}:
    delete:
      operationId: deletePaymentMethod
      summary: Удалить свой платёжный метод
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Admin Auth ───────────────────────────────────────────────
  /admin/login:
    post:
      operationId: adminLogin
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminToken"
        "401":
          description: Unauthorized

  # ── Admin Dashboard ──────────────────────────────────────────
  /admin/dashboard:
    get:
      operationId: getDashboard
      summary: Admin dashboard stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ── Support Tickets ──────────────────────────────────────────
  /support-tickets:
    get:
      operationId: getSupportTickets
      summary: List support tickets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicket"
    post:
      operationId: createSupportTicket
      summary: Create a support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"

  /support-tickets/{id}:
    patch:
      operationId: updateSupportTicket
      summary: Update ticket status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"

components:
  schemas:
    # ── Жалобы на станции ─────────────────────────────────────
    StationReportInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [not_working, wrong_price, wrong_location, wrong_connectors, permanently_closed, other]
        comment:
          type: string
          maxLength: 1000

    ResolveStationReportInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, rejected]
          description: confirmed — данные исправлены, rejected — данные верны

    StationReport:
      type: object
      required: [id, station_id, user_id, reason, status, created_at]
      properties:
        id: { type: integer }
        station_id: { type: integer }
        user_id: { type: string }
        reason:
          type: string
          enum: [not_working, wrong_price, wrong_location, wrong_connectors, permanently_closed, other]
        comment: { type: string, nullable: true }
        status:
          type: string
          enum: [new, confirmed, rejected]
        resolved_by: { type: string, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    # ── Auth ──────────────────────────────────────────────────
    RequestCodeInput:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: Любой формат, сервер нормализует к 998XXXXXXXXX
          example: "+998 90 123 45 67"

    RequestCodeResult:
      type: object
      required: [sent, expires_in_seconds, resend_after_seconds]
      properties:
        sent: { type: boolean }
        expires_in_seconds: { type: integer }
        resend_after_seconds: { type: integer }

    VerifyCodeInput:
      type: object
      required: [phone, code]
      properties:
        phone: { type: string }
        code:
          type: string
          pattern: "^[0-9]{6}$"
        device:
          type: string
          description: Подпись устройства для списка сессий

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in_seconds]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in_seconds: { type: integer }

    AuthSession:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [is_new_user, user]
          properties:
            is_new_user: { type: boolean }
            user: { $ref: "#/components/schemas/User" }

    RefreshTokenInput:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    UpdateProfileInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        language: { type: string, enum: [uz, ru, en] }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Operator ──────────────────────────────────────────────
    Operator:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        logo_url:
          type: ["string", "null"]
        station_count:
          type: integer

    OperatorInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        logo_url:
          type: ["string", "null"]

    # ── Connector ─────────────────────────────────────────────
    Connector:
      type: object
      required: [type, power_kw, total, available]
      properties:
        type:
          type: string
          enum: [CCS2, CHAdeMO, Type2, GB-T]
        power_kw:
          type: number
        total:
          type: integer
        available:
          type: integer

    # ── Station ───────────────────────────────────────────────
    Station:
      type: object
      required: [id, name, address, lat, lng, power_kw, price_per_kwh, status, source]
      properties:
        id:
          type: integer
        operator_id:
          type: ["integer", "null"]
        operator:
          $ref: "#/components/schemas/Operator"
        name:
          type: string
        address:
          type: string
        lat:
          type: number
        lng:
          type: number
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/Connector"
        power_kw:
          type: number
        price_per_kwh:
          type: number
        status:
          type: string
          enum: [free, occupied, offline]
        source:
          type: string
          enum: [manual, api, mock]
        amenities:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
        distance_km:
          type: ["number", "null"]
        is_promoted:
          type: boolean
        discount_pct:
          type: integer
        verified_at:
          type: string
          format: date-time
          nullable: true
          description: Когда станцию последний раз проверяли живьём
        verified_by:
          type: string
          nullable: true
          description: Почта администратора, проверившего станцию

    StationsResponse:
      type: object
      required: [promoted, nearby]
      properties:
        promoted:
          type: array
          items:
            $ref: "#/components/schemas/Station"
        nearby:
          type: array
          items:
            $ref: "#/components/schemas/Station"

    StationInput:
      type: object
      required: [name, address, lat, lng, power_kw, price_per_kwh, status]
      properties:
        operator_id:
          type: ["integer", "null"]
        name:
          type: string
        address:
          type: string
        lat:
          type: number
        lng:
          type: number
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/Connector"
        power_kw:
          type: number
        price_per_kwh:
          type: number
        status:
          type: string
          enum: [free, occupied, offline]
        source:
          type: string
          enum: [manual, api, mock]
        amenities:
          type: array
          items:
            type: string

    StationStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [free, occupied, offline]

    # ── Vehicle ───────────────────────────────────────────────
    Vehicle:
      type: object
      required: [id, name, battery_kwh, range_km, connector_type]
      properties:
        id:
          type: integer
        name:
          type: string
        battery_kwh:
          type: number
        range_km:
          type: number
        connector_type:
          type: string
          enum: [CCS2, CHAdeMO, Type2, GB-T]
        current_battery_pct:
          type: ["number", "null"]

    VehicleInput:
      type: object
      required: [name, battery_kwh, range_km, connector_type]
      properties:
        name:
          type: string
        battery_kwh:
          type: number
        range_km:
          type: number
        connector_type:
          type: string
          enum: [CCS2, CHAdeMO, Type2, GB-T]
        current_battery_pct:
          type: ["number", "null"]

    # ── Route Stop ────────────────────────────────────────────
    RouteStop:
      type: object
      required: [station_id, station_name, arrival_battery_pct, departure_battery_pct, charge_time_min, distance_from_prev_km]
      properties:
        station_id:
          type: integer
        station_name:
          type: string
        address:
          type: string
        lat:
          type: number
        lng:
          type: number
        arrival_battery_pct:
          type: number
        departure_battery_pct:
          type: number
        charge_time_min:
          type: integer
        distance_from_prev_km:
          type: number
        eta:
          type: string

    # ── Route ─────────────────────────────────────────────────
    Route:
      type: object
      required: [id, origin, destination, total_distance_km, total_time_min, status, created_at]
      properties:
        id:
          type: integer
        vehicle_id:
          type: ["integer", "null"]
        vehicle:
          $ref: "#/components/schemas/Vehicle"
        origin:
          type: string
        destination:
          type: string
        origin_lat:
          type: ["number", "null"]
        origin_lng:
          type: ["number", "null"]
        dest_lat:
          type: ["number", "null"]
        dest_lng:
          type: ["number", "null"]
        initial_battery_pct:
          type: number
        stops:
          type: array
          items:
            $ref: "#/components/schemas/RouteStop"
        total_distance_km:
          type: number
        total_time_min:
          type: integer
        status:
          type: string
          enum: [active, completed, cancelled]
        created_at:
          type: string
          format: date-time

    RouteInput:
      type: object
      required: [origin, destination, initial_battery_pct]
      properties:
        origin:
          type: string
        destination:
          type: string
        origin_lat:
          type: ["number", "null"]
        origin_lng:
          type: ["number", "null"]
        dest_lat:
          type: ["number", "null"]
        dest_lng:
          type: ["number", "null"]
        vehicle_id:
          type: ["integer", "null"]
        initial_battery_pct:
          type: number

    # ── Session ───────────────────────────────────────────────
    Session:
      type: object
      required: [id, station_id, status, started_at]
      properties:
        id:
          type: integer
        station_id:
          type: integer
        station:
          $ref: "#/components/schemas/Station"
        user_id:
          type: ["string", "null"]
        energy_kwh:
          type: ["number", "null"]
        cost_tiyin:
          description: Стоимость сессии в тийинах (1 сум = 100 тийин), целое.
          type: ["integer", "null"]
        status:
          type: string
          enum: [active, completed, cancelled]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: ["string", "null"]
          format: date-time
        connector_type:
          type: ["string", "null"]
        payment_method_id:
          type: ["integer", "null"]
        progress_pct:
          type: ["number", "null"]

    SessionInput:
      type: object
      required: [station_id]
      properties:
        station_id:
          type: integer
        user_id:
          type: ["string", "null"]
        connector_type:
          type: ["string", "null"]
        payment_method_id:
          type: ["integer", "null"]

    # ── User ──────────────────────────────────────────────────
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        membership_tier:
          type: string
          enum: [free, premium]
        total_sessions:
          type: integer
        total_spent:
          type: number
        total_energy_kwh:
          type: number
        co2_saved_kg:
          type: number
        created_at:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
        name:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]

    UserUpdate:
      type: object
      properties:
        name:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        membership_tier:
          type: string
          enum: [free, premium]

    # ── Payment Method ────────────────────────────────────────
    PaymentMethod:
      type: object
      required: [id, type, last_four, is_default]
      properties:
        id:
          type: integer
        user_id:
          type: string
        type:
          type: string
        last_four:
          type: string
        is_default:
          type: boolean

    PaymentMethodInput:
      type: object
      required: [type, last_four]
      properties:
        user_id:
          type: ["string", "null"]
        type:
          type: string
        last_four:
          type: string
        is_default:
          type: boolean

    # ── Notification ─────────────────────────────────────────
    Notification:
      type: object
      required: [id, user_id, type, title, body, read, created_at]
      properties:
        id:
          type: integer
        user_id:
          type: string
        type:
          type: string
          enum: [session_ended, discount_nearby, station_available, low_battery]
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        created_at:
          type: string
          format: date-time

    NotificationInput:
      type: object
      required: [user_id, type, title, body]
      properties:
        user_id:
          type: string
        type:
          type: string
          enum: [session_ended, discount_nearby, station_available, low_battery]
        title:
          type: string
        body:
          type: string

    # ── PushToken ─────────────────────────────────────────────
    PushToken:
      type: object
      required: [id, user_id, platform, token, created_at]
      properties:
        id:
          type: integer
        user_id:
          type: string
        platform:
          type: string
          enum: [ios, android, web]
        token:
          type: string
        created_at:
          type: string
          format: date-time

    PushTokenInput:
      type: object
      required: [user_id, platform, token]
      properties:
        user_id:
          type: string
        platform:
          type: string
          enum: [ios, android, web]
        token:
          type: string

    # ── Admin ─────────────────────────────────────────────────
    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AdminToken:
      type: object
      required: [token, email]
      properties:
        token:
          type: string
        email:
          type: string

    DashboardStats:
      type: object
      required: [total_stations, free_stations, occupied_stations, offline_stations, active_sessions, total_sessions, total_users, total_revenue, revenue_today, sessions_today]
      properties:
        total_stations:
          type: integer
        free_stations:
          type: integer
        occupied_stations:
          type: integer
        offline_stations:
          type: integer
        active_sessions:
          type: integer
        total_sessions:
          type: integer
        total_users:
          type: integer
        total_revenue:
          type: number
        revenue_today:
          type: number
        sessions_today:
          type: integer
        top_operators:
          type: array
          items:
            $ref: "#/components/schemas/Operator"

    # ── Support ───────────────────────────────────────────────
    SupportTicket:
      type: object
      required: [id, subject, message, status, created_at]
      properties:
        id:
          type: integer
        user_id:
          type: ["string", "null"]
        user_email:
          type: ["string", "null"]
        subject:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: ["string", "null"]
          format: date-time

    SupportTicketInput:
      type: object
      required: [subject, message]
      properties:
        user_id:
          type: ["string", "null"]
        user_email:
          type: ["string", "null"]
        subject:
          type: string
        message:
          type: string

    SupportTicketUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
